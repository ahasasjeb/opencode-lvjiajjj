name: Publish dev prerelease

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: publish-dev-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish CLI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Set prerelease version
        shell: bash
        run: |
          version="0.0.0-dev-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "OPENCODE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"

      - name: Build CLI
        run: bun run ./packages/opencode/script/build.ts
        env:
          OPENCODE_CHANNEL: dev

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          for directory in packages/opencode/dist/opencode-*; do
            name="$(basename "$directory")"
            if [[ "$name" == opencode-windows-* ]]; then
              (
                cd "$directory/bin"
                zip -9 "$GITHUB_WORKSPACE/release/${name}.zip" opencode.exe
              )
              continue
            fi
            tar -czf "release/${name}.tar.gz" -C "$directory/bin" opencode
          done

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --prerelease
