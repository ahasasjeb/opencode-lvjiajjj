name: Publish npm binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version, for example 1.17.15"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Build scoped binary packages
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_NPM_SCOPE: "@lzy1234"
        run: bun run --cwd packages/opencode build

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/opencode/dist/@lzy1234/opencode-*; do
            npm publish "$dir" --access public --tag "${{ inputs.tag }}"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packages/opencode/dist/@lzy1234/opencode --access public --tag "${{ inputs.tag }}"
